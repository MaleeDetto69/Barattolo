<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPresenter - Crea le tue Slide</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/theme/black.min.css" id="theme">

    <style>
        :root {
            --primary: #3498db;
            --dark: #2c3e50;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #f4f7f6;
        }

        /* Editor Sidebar */
        #editor-container {
            width: 400px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .header {
            padding: 20px;
            background: var(--dark);
            color: white;
        }

        textarea {
            flex-grow: 1;
            padding: 15px;
            border: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }

        .controls {
            padding: 15px;
            background: #eee;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-play { background: #2ecc71; color: white; width: 100%; margin-bottom: 10px; }
        .btn-theme { background: var(--primary); color: white; flex: 1; }
        
        /* Preview Area */
        #preview-container {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        /* Fullscreen mode */
        .fullscreen #editor-container {
            transform: translateX(-100%);
            position: absolute;
        }

        #exit-fs {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }
    </style>
</head>
<body>

<div id="editor-container">
    <div class="header">
        <h2>WebPresenter</h2>
        <p style="font-size: 12px; opacity: 0.8;">Usa --- per separare le slide</p>
    </div>
    
    <textarea id="slide-input" placeholder="Scrivi qui...">
