<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Geo-Dash Ultra Evolution</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { position: relative; width: 800px; height: 400px; border: 4px solid #333; background: #050505; }
        canvas { display: block; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 20; color: white; }
        .hidden { display: none !important; }
        button { padding: 15px 35px; margin: 8px; cursor: pointer; background: #2ecc71; border: none; color: white; font-weight: bold; border-radius: 5px; font-size: 18px; transition: 0.2s; box-shadow: 0 4px 0 #27ae60; }
        button:active { transform: translateY(4px); box-shadow: none; }
        #hud { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; font-family: monospace; }
        .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .skin-box { width: 50px; height: 50px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #222; }
        .skin-box.active { border-color: #2ecc71; background: #333; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="hud" class="hidden">0%</div>

    <div id="main-menu" class="overlay">
        <h1 style="font-size: 50px; color: #2ecc71; margin-bottom: 30px;">ULTRA DASH</h1>
        <button onclick="showScreen('level-menu')">GIOCA</button>
        <button onclick="showScreen('custom-menu')" style="background:#9b59b6; box-shadow: 0 4px 0 #8e44ad;">SKINS</button>
    </div>

    <div id="level-menu" class="overlay hidden">
        <h2>LIVELLI</h2>
        <button onclick="initGame(0)">1. THE BEGINNING (Easy)</button>
        <button onclick="initGame(1)">2. GRAVITY FALLS (Medium)</button>
        <button onclick="initGame(2)">3. SHIP MADNESS (Hard)</button>
        <button onclick="initGame(3)">4. DIMENSION X (Insane)</button>
        <button onclick="initGame(4)" style="background:#e74c3c">5. ULTIMATE TRIAL (Demon)</button>
        <button onclick="showScreen('main-menu')" style="background:#555; box-shadow: 0 4px 0 #333;">BACK</button>
    </div>

    <div id="custom-menu" class="overlay hidden">
        <h2>PERSONALIZZA</h2>
        <div class="skin-grid">
            <div class="skin-box active" onclick="setSkin(0, this)">■</div>
            <div class="skin-box" onclick="setSkin(1, this)">▣</div>
            <div class="skin-box" onclick="setSkin(2, this)">◈</div>
            <div class="skin-box" onclick="setSkin(3, this)">⬚</div>
            <div class="skin-box" onclick="setSkin(4, this)">✖</div>
            <div class="skin-box" onclick="setSkin(5, this)">⚔</div>
        </div>
        <input type="color" id="colorP" value="#00ff00" onchange="player.color = this.value">
        <button onclick="showScreen('main-menu')" style="margin-top: 20px;">SALVA</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'menu';
let frame = 0;
let worldGravity = 0.9;
let cameraX = 0;
let levelWidth = 0;
let shake = 0;

const player = {
    x: 200, y: 300, w: 30, h: 30,
    vy: 0, rot: 0, color: '#00ff00', skin: 0,
    mode: 'cube', gSign: 1, // 1 normale, -1 invertita
    onGround: false, alive: true
};

let obstacles = [];
let inputs = { jump: false };

// Input robusto per evitare il salto automatico
window.addEventListener('keydown', e => { if(['Space', 'ArrowUp', 'KeyW'].includes(e.code)) inputs.jump = true; });
window.addEventListener('keyup', e => { if(['Space', 'ArrowUp', 'KeyW'].includes(e.code)) inputs.jump = false; });
canvas.addEventListener('mousedown', () => inputs.jump = true);
canvas.addEventListener('mouseup', () => inputs.jump = false);

function showScreen(id) {
    document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
    if(id !== 'none') document.getElementById(id).classList.remove('hidden');
}

function setSkin(id, el) {
    player.skin = id;
    document.querySelectorAll('.skin-box').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

function createLevel(idx) {
    obstacles = [];
    const unit = 60;
    const lData = [
        "____SSS__B__B__SSS__B__B__P____SSS____C__B_B_S_B",
        "B_G_B_B_G_B_B_G_B_B_S_S_S_B_P____S____C_B",
        "B_P____SSSSSS____C_B_S_B_S_B_S_B",
        "B_G_P_G_P_G_P_C_G_C_G_C_B_S_S_S",
        "B_S_B_G_S_B_P_S_G_S_C_S_G_S_B_S_B_S_B_S_B"
    ];

    let segments = lData[idx].split('');
    segments.forEach((char, i) => {
        let x = 600 + (i * 200);
        if(char === 'B') obstacles.push({x, y: 320, t: 'block', w: 40, h: 40});
        if(char === 'S') obstacles.push({x, y: 330, t: 'spike', w: 30, h: 30});
        if(char === 'P') obstacles.push({x, y: 200, t: 'pShip', w: 40, h: 120});
        if(char === 'C') obstacles.push({x, y: 200, t: 'pCube', w: 40, h: 120});
        if(char === 'G') obstacles.push({x, y: 200, t: 'pGrav', w: 40, h: 120});
    });
    levelWidth = 600 + (segments.length * 200) + 1000;
}

function initGame(idx) {
    gameState = 'playing';
    cameraX = 0;
    player.y = 300;
    player.vy = 0;
    player.gSign = 1;
    player.mode = 'cube';
    player.alive = true;
    createLevel(idx);
    document.getElementById('hud').classList.remove('hidden');
    showScreen('none');
}

function update() {
    if(gameState !== 'playing') return;

    // Fisica
    if(player.mode === 'cube') {
        if(inputs.jump && player.onGround) {
            player.vy = -14 * player.gSign;
            player.onGround = false;
        }
        player.vy += worldGravity * player.gSign;
        player.rot += 0.15 * player.gSign;
    } else {
        // Mode SHIP
        if(inputs.jump) player.vy -= 0.8 * player.gSign;
        player.vy += 0.45 * player.gSign;
        player.rot = player.vy * 0.05;
    }

    player.y += player.vy;
    cameraX += 8;

    // Limiti pavimento/soffitto
    let floorY = 330;
    let ceilY = 40;

    if(player.gSign === 1) {
        if(player.y > floorY) { player.y = floorY; player.vy = 0; player.onGround = true; }
    } else {
        if(player.y < ceilY) { player.y = ceilY; player.vy = 0; player.onGround = true; }
    }

    // Hitbox e Collisioni
    obstacles.forEach(o => {
        let ox = o.x - cameraX;
        // Collisione generica AABB (leggermente ridotta)
        if(player.x < ox + o.w - 5 && player.x + player.w > ox + 5 && 
           player.y < o.y + o.h - 5 && player.y + player.h > o.y + 5) {
            
            if(o.t === 'spike') die();
            if(o.t === 'pShip') player.mode = 'ship';
            if(o.t === 'pCube') player.mode = 'cube';
            if(o.t === 'pGrav') {
                if(frame % 20 === 0) { // Debounce portale gravità
                    player.gSign *= -1;
                    player.vy = 0;
                }
            }
            if(o.t === 'block') {
                // Se atterro sul blocco (sopra o sotto in base a gravità)
                let landing = (player.gSign === 1) ? (player.vy >= 0 && player.y + player.h < o.y + 20) : (player.vy <= 0 && player.y > o.y + 20);
                if(landing) {
                    player.y = (player.gSign === 1) ? o.y - player.h : o.y + o.h;
                    player.vy = 0;
                    player.onGround = true;
                } else {
                    die();
                }
            }
        }
    });

    if(player.y < -100 || player.y > 500) die();

    let progress = Math.min(100, Math.floor((cameraX / levelWidth) * 100));
    document.getElementById('hud').innerText = progress + "%";
    if(progress >= 100) win();
    
    frame++;
}

function die() {
    shake = 15;
    player.alive = false;
    setTimeout(() => {
        gameState = 'menu';
        showScreen('main-menu');
    }, 500);
}

function win() {
    alert("LIVELLO COMPLETATO!");
    gameState = 'menu';
    showScreen('level-menu');
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    if(shake > 0) {
        ctx.translate(Math.random()*shake, Math.random()*shake);
        shake *= 0.9;
    }

    // Sfondo e Griglia
    ctx.fillStyle = '#050510';
    ctx.fillRect(0,0,800,400);
    ctx.strokeStyle = '#101025';
    for(let i=0; i<800; i+=50) {
        ctx.beginPath(); ctx.moveTo(i - (cameraX*0.3%50), 0); ctx.lineTo(i - (cameraX*0.3%50), 400); ctx.stroke();
    }

    // Suolo e Soffitto
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 360, 800, 40);
    ctx.fillRect(0, 0, 800, 40);
    ctx.strokeStyle = player.color;
    ctx.strokeRect(0, 360, 800, 2);
    ctx.strokeRect(0, 40, 800, -2);

    // Ostacoli
    obstacles.forEach(o => {
        let ox = o.x - cameraX;
        if(ox < -100 || ox > 900) return;

        ctx.save();
        if(o.t === 'block') {
            ctx.fillStyle = '#222';
            ctx.strokeStyle = '#555';
            ctx.fillRect(ox, o.y, o.w, o.h);
            ctx.strokeRect(ox, o.y, o.w, o.h);
        } else if(o.t === 'spike') {
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.moveTo(ox, o.y+o.h); ctx.lineTo(ox+o.w/2, o.y); ctx.lineTo(ox+o.w, o.y+o.h);
            ctx.fill();
        } else {
            // Portali
            ctx.lineWidth = 4;
            ctx.strokeStyle = o.t === 'pShip' ? '#f1c40f' : (o.t === 'pCube' ? '#3498db' : '#9b59b6');
            ctx.strokeRect(ox, o.y, o.w, o.h);
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = ctx.strokeStyle;
            ctx.fillRect(ox, o.y, o.w, o.h);
        }
        ctx.restore();
    });

    // Player
    if(player.alive) {
        ctx.save();
        ctx.translate(player.x + 15, player.y + 15);
        ctx.rotate(player.rot);
        ctx.fillStyle = player.color;
        
        if(player.mode === 'cube') {
            ctx.fillRect(-15, -15, 30, 30);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(-15, -15, 30, 30);
            // Skins
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            if(player.skin == 1) ctx.fillRect(-8,-8,16,16);
            if(player.skin == 2) { ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.fill(); }
            if(player.skin == 3) ctx.strokeRect(-10,-10,20,20);
            if(player.skin == 4) { ctx.beginPath(); ctx.moveTo(-15,-15); ctx.lineTo(15,15); ctx.stroke(); }
            if(player.skin == 5) { ctx.fillRect(-15,-2,30,4); ctx.fillRect(-2,-15,4,30); }
        } else {
            ctx.beginPath();
            ctx.moveTo(-18, 12); ctx.lineTo(20, 0); ctx.lineTo(-18, -12);
            ctx.closePath(); ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    ctx.restore();
    if(gameState === 'playing') requestAnimationFrame(draw);
}

// Loop logico separato per precisione
setInterval(update, 1000/60);
</script>
</body>
</html>
